<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#0e051e"/>
  <!-- soft glow -->
  <ellipse cx="200" cy="125" rx="90" ry="100" fill="#6a3fac" opacity="0.08"/>
  <!-- shield outer border / shadow -->
  <path d="M120,55 L280,55 L280,165 Q280,200 200,230 Q120,200 120,165 Z" fill="#1a0640"/>
  <!-- shield main body -->
  <path d="M128,63 L272,63 L272,163 Q272,196 200,224 Q128,196 128,163 Z" fill="#2a1050"/>
  <!-- vertical divider -->
  <rect x="196" y="63" width="8" height="161" fill="#1a0640"/>
  <!-- horizontal divider at 1/3 height -->
  <rect x="128" y="120" width="144" height="8" fill="#1a0640"/>
  <!-- top-left quadrant: lion silhouette simplified (rampant) -->
  <ellipse cx="163" cy="98" rx="18" ry="22" fill="#8a5a18" opacity="0.7"/>
  <circle cx="163" cy="82" r="10" fill="#8a5a18" opacity="0.7"/>
  <ellipse cx="152" cy="105" rx="8" ry="14" fill="#8a5a18" opacity="0.5" transform="rotate(-20 152 105)"/>
  <ellipse cx="173" cy="105" rx="6" ry="14" fill="#8a5a18" opacity="0.5" transform="rotate(20 173 105)"/>
  <!-- top-right quadrant: fleur-de-lis shape -->
  <ellipse cx="237" cy="80" rx="6" ry="16" fill="#4a3090" opacity="0.9"/>
  <ellipse cx="224" cy="95" rx="9" ry="6" fill="#4a3090" opacity="0.9" transform="rotate(-30 224 95)"/>
  <ellipse cx="250" cy="95" rx="9" ry="6" fill="#4a3090" opacity="0.9" transform="rotate(30 250 95)"/>
  <rect x="234" y="94" width="6" height="18" rx="3" fill="#4a3090" opacity="0.9"/>
  <!-- bottom-left: horizontal stripes -->
  <rect x="130" y="132" width="62" height="8" rx="2" fill="#8a5a18" opacity="0.5"/>
  <rect x="130" y="148" width="62" height="8" rx="2" fill="#8a5a18" opacity="0.5"/>
  <rect x="130" y="164" width="60" height="8" rx="2" fill="#8a5a18" opacity="0.5"/>
  <!-- bottom-right: diagonal cross (saltire) -->
  <line x1="208" y1="132" x2="270" y2="185" stroke="#4a3090" stroke-width="7" opacity="0.7"/>
  <line x1="270" y1="132" x2="210" y2="182" stroke="#4a3090" stroke-width="7" opacity="0.7"/>
  <!-- gold border on shield -->
  <path d="M128,63 L272,63 L272,163 Q272,196 200,224 Q128,196 128,163 Z"
        fill="none" stroke="#c9a84c" stroke-width="3.5" opacity="0.55"/>
</svg>
